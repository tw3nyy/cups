<script>
var telegramReady = (function () {
  if (window.Telegram && window.Telegram.WebApp) return Promise.resolve();
  var launch = /(?:^#|[?&])tgWebAppData=/.test(location.hash);
  // The Telegram SDK restores launch data from sessionStorage after in-app reloads.
  try {
    var cached = JSON.parse(sessionStorage.getItem('__telegram__initParams'));
    launch = launch || !!(cached && cached.tgWebAppData);
  } catch (e) {}
  if (!launch) return Promise.resolve();
  return new Promise(function (resolve) {
    var sdk = document.createElement('script');
    sdk.src = 'https://telegram.org/js/telegram-web-app.js';
    sdk.onload = sdk.onerror = resolve;
    document.head.appendChild(sdk);
  });
})();
</script>

<style>
#startup {
  position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center;
  box-sizing: border-box; overflow: auto; padding: 24px;
  background: radial-gradient(ellipse at 50% 42%, #fcf5eb, #f3e5d5 70%, #edddcd);
  color: #372a20; text-align: center; font: 15px/1.5 system-ui, sans-serif;
  transition: opacity .34s ease;
}
.startup-inner { display: grid; justify-items: center; gap: 8px; transition: transform .34s ease; }
#startup.leaving { pointer-events: none; opacity: 0; }
#startup.leaving .startup-inner { transform: translateY(-8px) scale(1.035); }
.startup-art {
  position: relative; width: 172px; height: 172px; margin-bottom: 10px; border-radius: 50%;
  background: radial-gradient(circle at 44% 35%, #fdf6ec 36%, #ecd2b9 100%);
  border: 1px solid #ae816157; box-shadow: 0 16px 40px #a66d4723;
}
.startup-cup {
  position: absolute; top: 76px; left: 42px; width: 80px; height: 48px;
  border-radius: 8px 8px 29px 29px;
  background: linear-gradient(155deg, #79543b 12%, #4b3225 78%);
  box-shadow: inset 0 3px #9b7357, 0 7px 10px #61422f26;
  animation: cups-arrive .55s cubic-bezier(.16, 1, .3, 1) both;
}
.startup-cup::after {
  content: ""; position: absolute; top: 9px; left: 74px; width: 21px; height: 20px;
  border: 5px solid #5c3e2e; border-left: 0; border-radius: 0 18px 18px 0;
}
.startup-cup::before {
  content: ""; position: absolute; top: 54px; left: -9px; width: 98px; height: 4px;
  border-radius: 50%; background: #9c7357;
}
.startup-steam {
  position: absolute; top: 38px; left: 62px; width: 12px; height: 32px;
  border-left: 2px solid #8d6146; border-radius: 50%;
  animation: cups-steam 1.75s ease-in-out infinite;
}
.startup-steam:nth-child(2) { left: 80px; animation-delay: .26s; }
.startup-steam:nth-child(3) { left: 98px; animation-delay: .53s; }
.startup-wordmark { font: 500 52px/1 Georgia, serif; letter-spacing: -.055em; animation: cups-arrive .6s .04s ease-out both; }
.startup-status { margin: 3px 0 0; max-width: 25ch; color: #6d503d; }
.startup-progress { display: flex; gap: 5px; margin: 8px 0 0; }
.startup-progress i { width: 5px; height: 5px; border-radius: 50%; background: #896147; animation: cups-dots 1.35s ease-in-out infinite; }
.startup-progress i:nth-child(2) { animation-delay: .14s; }
.startup-progress i:nth-child(3) { animation-delay: .28s; }
@keyframes cups-arrive {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes cups-steam {
  0% { opacity: 0; transform: translate(0, 9px) rotate(-16deg) scaleY(.65); }
  38% { opacity: .8; }
  100% { opacity: 0; transform: translate(6px, -11px) rotate(16deg); }
}
@keyframes cups-dots {
  0%, 62%, 100% { opacity: .42; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}
@media (prefers-reduced-motion: reduce) {
  #startup, .startup-inner { transition: none; }
  .startup-cup, .startup-wordmark, .startup-steam, .startup-progress i { animation: none; }
}
#startup-retry {
  min-height: 44px; padding: 6px 16px; border: 1px solid #956846; border-radius: 12px;
  background: #fcf5eb; color: #4b3225; font: inherit; cursor: pointer;
}
</style>

<style>
/* Modern iOS look: system type, grouped inset lists on a cool grey ground, floating glass tab bar,
   vivid section colours. Brand lives in the photography and the CUPS wordmark. */
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --surface-2: #EDEDF2; --ink: #0B0B10; --ink-2: #48484E; --muted: #8A8A92;
  --line: rgba(60, 60, 67, .13); --line-2: rgba(60, 60, 67, .22); --fill: rgba(120, 120, 128, .12);
  --brand: #CDA88E; --brand-ink: #2A211B;
  --accent: #1E8F63; --accent-ink: #FFFFFF; --accent-soft: rgba(30, 143, 99, .12);
  --cherry: #E5484D; --cherry-soft: rgba(229, 72, 77, .12); --ok-soft: rgba(30, 143, 99, .14); --star: #FF9F0A;
  --navbg: rgba(242, 242, 247, .78); --tabbg: rgba(255, 255, 255, .74);
  --shadow: 0 2px 6px rgba(20, 20, 40, .06), 0 14px 34px rgba(20, 20, 40, .10);
  --s-kitchen: #1E9E64; --s-kitchen-bg: rgba(30, 158, 100, .13);
  --s-drinks: #0A7AEF; --s-drinks-bg: rgba(10, 122, 239, .12);
  --s-dessert: #E8365D; --s-dessert-bg: rgba(232, 54, 93, .12);
  --s-bakery: #D97E00; --s-bakery-bg: rgba(217, 126, 0, .14);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-display: var(--font-ui); --font-mono: var(--font-ui);
  --font-brand: "Playfair Display", "Bodoni 72", Didot, Georgia, serif;
  --nav-h: 44px; --tab-h: 78px;
  /* Telegram fullscreen draws its own buttons over the page and publishes their size as --tg-* vars */
  --top-inset: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
  --bottom-inset: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --ink: #FFFFFF; --ink-2: #D1D1D6; --muted: #98989F;
    --line: rgba(84, 84, 88, .55); --line-2: rgba(84, 84, 88, .75); --fill: rgba(120, 120, 128, .24);
    --brand: #D9B79F; --accent: #3CCB8F; --accent-ink: #00170D; --accent-soft: rgba(60, 203, 143, .16);
    --cherry: #FF6B70; --cherry-soft: rgba(255, 107, 112, .16); --ok-soft: rgba(60, 203, 143, .18); --star: #FFB340;
    --navbg: rgba(0, 0, 0, .72); --tabbg: rgba(38, 38, 40, .72); --shadow: 0 2px 6px rgba(0, 0, 0, .5), 0 14px 34px rgba(0, 0, 0, .5);
    --s-kitchen: #4FD08F; --s-kitchen-bg: rgba(79, 208, 143, .16); --s-drinks: #4DA3FF; --s-drinks-bg: rgba(77, 163, 255, .16);
    --s-dessert: #FF7A93; --s-dessert-bg: rgba(255, 122, 147, .16); --s-bakery: #FFB340; --s-bakery-bg: rgba(255, 179, 64, .16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --ink: #FFFFFF; --ink-2: #D1D1D6; --muted: #98989F;
  --line: rgba(84, 84, 88, .55); --line-2: rgba(84, 84, 88, .75); --fill: rgba(120, 120, 128, .24);
  --brand: #D9B79F; --accent: #3CCB8F; --accent-ink: #00170D; --accent-soft: rgba(60, 203, 143, .16);
  --cherry: #FF6B70; --cherry-soft: rgba(255, 107, 112, .16); --ok-soft: rgba(60, 203, 143, .18); --star: #FFB340;
  --navbg: rgba(0, 0, 0, .72); --tabbg: rgba(38, 38, 40, .72); --shadow: 0 2px 6px rgba(0, 0, 0, .5), 0 14px 34px rgba(0, 0, 0, .5);
  --s-kitchen: #4FD08F; --s-kitchen-bg: rgba(79, 208, 143, .16); --s-drinks: #4DA3FF; --s-drinks-bg: rgba(77, 163, 255, .16);
  --s-dessert: #FF7A93; --s-dessert-bg: rgba(255, 122, 147, .16); --s-bakery: #FFB340; --s-bakery-bg: rgba(255, 179, 64, .16);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.42;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--top-inset); z-index: 60; background: var(--navbg); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4, p, ul, dl, dd { margin: 0; padding: 0; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.wrap { max-width: 560px; margin: 0 auto; }
.view { padding-top: var(--nav-h); padding-bottom: calc(var(--tab-h) + var(--bottom-inset) + 28px); min-height: 100vh; }
.view.enter { animation: fadeup .22s ease-out; }
.view.push { animation: pushin .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pushin { from { opacity: .3; transform: translateX(28px); } to { opacity: 1; transform: none; } }

/* ---------- nav (top) ---------- */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding-top: var(--top-inset); transition: background .2s; }
.nav.scrolled { background: var(--navbg); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); box-shadow: 0 .5px 0 var(--line-2); }
.nav-in { max-width: 560px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: 1fr minmax(0, 2fr) 1fr; align-items: center; gap: 4px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-title { text-align: center; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .15s; }
.nav.titled .nav-title { opacity: 1; }
.nav-l { display: flex; justify-content: flex-start; }
.nav-r { display: flex; justify-content: flex-end; gap: 2px; }
.nbtn { min-width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; color: var(--accent); font-size: 16px; border-radius: 12px; }
.nbtn svg { width: 24px; height: 24px; }
.nbtn:disabled { opacity: .35; }
.nbtn.star.on { color: var(--star); }
.nbtn.star.on svg path { fill: currentColor; }
.nbtn.back { padding-right: 8px; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--tabbg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 -.5px 0 var(--line-2); padding-bottom: var(--bottom-inset); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tab-h);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 10.5px; font-weight: 500; letter-spacing: .01em; position: relative; }
.tab svg { width: 26px; height: 26px; stroke-width: 1.7; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab[aria-current="page"] svg { stroke-width: 2.1; }
.tab .badge { position: absolute; top: 5px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--cherry); color: #fff; font-size: 10px; line-height: 16px; text-align: center; font-weight: 600; }

/* ---------- icons ---------- */
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.fill { fill: currentColor; stroke: none; }

/* ---------- titles ---------- */
.lt { font-family: var(--font-display); font-weight: 500; font-size: 34px; line-height: 1.1; letter-spacing: -.01em; padding: 6px 0 4px; text-wrap: balance; }
.lt-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.gh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 22px 4px 8px; }
.gh .eyebrow { font-size: 12px; }
.gh button { color: var(--accent); font-size: 14px; font-weight: 500; }

/* section color scope */
.s-Кухня { --sf: var(--s-kitchen); --sb: var(--s-kitchen-bg); }
.s-Напитки { --sf: var(--s-drinks); --sb: var(--s-drinks-bg); }
.s-Десерты { --sf: var(--s-dessert); --sb: var(--s-dessert-bg); }
.s-Выпечка { --sf: var(--s-bakery); --sb: var(--s-bakery-bg); }
.s-all { --sf: var(--accent); --sb: var(--accent-soft); }

/* ---------- hero ---------- */
.hero { position: relative; border-radius: 24px; overflow: hidden; min-height: 172px; margin-top: 2px; background: var(--brand) center / cover no-repeat; color: #FBF6EF; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px 20px 18px; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(24, 16, 10, .82) 0%, rgba(24, 16, 10, .35) 55%, rgba(24, 16, 10, .05) 100%); }
.wm { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1; align-self: flex-start; }
.wm small { font-family: var(--font-ui); font-size: 12.5px; letter-spacing: .02em; font-weight: 400; margin-bottom: 4px; opacity: .92; }
.wm b { font-family: var(--font-display); font-weight: 400; font-size: 54px; letter-spacing: .14em; margin-right: -.14em; line-height: .95; }
.hero p { margin-top: 12px; font-size: 14px; opacity: .92; max-width: 30ch; }

/* ---------- search ---------- */
.sbar { position: sticky; top: calc(var(--nav-h) + var(--top-inset)); z-index: 20; display: flex; gap: 10px; align-items: center; padding: 8px 0 8px; background: var(--bg); box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(0 -100vmax); }
.sbar.nobg { background: transparent; box-shadow: none; clip-path: none; }
.sfield { position: relative; flex: 1; min-width: 0; }
.sfield .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--muted); pointer-events: none; }
.sfield input { width: 100%; height: 44px; border: 0; border-radius: 13px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; padding: 0 40px 0 38px; box-shadow: inset 0 0 0 1px var(--line); }
.sfield input::placeholder { color: var(--muted); }
.sfield input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.sfield input::-webkit-search-cancel-button { display: none; }
.sclear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); }
.sclear .ic { position: static; transform: none; width: 18px; height: 18px; }
.scancel { color: var(--accent); font-weight: 500; padding: 8px 2px; }

/* ---------- section tiles ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.tile { position: relative; min-height: 124px; border-radius: 20px; overflow: hidden; text-align: left; color: #FBF6EF; background: var(--sf) center / cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px 14px; isolation: isolate; box-shadow: var(--shadow); }
.tile::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(18, 12, 8, .82), rgba(18, 12, 8, .15) 70%); }
.tile .ic { width: 22px; height: 22px; position: absolute; top: 12px; right: 12px; opacity: .95; }
.tile b { font-family: var(--font-display); font-weight: 500; font-size: 21px; line-height: 1.1; }
.tile span { font-size: 12.5px; opacity: .9; margin-top: 2px; }
.tile:active { transform: scale(.985); }

/* ---------- grouped lists ---------- */
.group { background: var(--surface); border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.cell { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 14px 10px 12px; min-height: 64px; position: relative; }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; border-top: .5px solid var(--line-2); }
.cell.plain + .cell.plain::before { left: 14px; }
.cell:active { background: var(--surface-2); }
.thumb { width: 48px; height: 48px; border-radius: 12px; flex: none; background: var(--sb) center / cover no-repeat; color: var(--sf); display: grid; place-items: center; overflow: hidden; }
.thumb .ic { width: 24px; height: 24px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ctx { min-width: 0; flex: 1; }
.ctx b { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ctx small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx small.sn { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--sf); margin-right: 6px; vertical-align: 1px; }
.trail { display: flex; align-items: center; gap: 8px; color: var(--muted); flex: none; }
.trail .ic { width: 18px; height: 18px; }
.learned { width: 20px; height: 20px; color: var(--accent); }
.favmark { color: var(--star); width: 15px; height: 15px; }
.cnt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 18px; background: var(--surface); border-radius: 18px; box-shadow: 0 0 0 1px var(--line); }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 13.5px; padding: 10px 4px 0; }

/* chips */
.hscroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hscroll::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 14.5px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.chip small { font-family: var(--font-mono); opacity: .65; margin-left: 5px; font-size: 12px; }
.rcard { flex: none; width: 150px; padding: 10px 12px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); text-align: left; display: flex; flex-direction: column; gap: 4px; }
.rcard .sdot { margin-right: 5px; }
.rcard b { font-size: 14px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rcard small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- detail ---------- */
.dhero { margin-top: 4px; border-radius: 22px; overflow: hidden; background: var(--sb); position: relative; }
.dhero img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.dhero.ph { height: 118px; display: grid; place-items: center; color: var(--sf); }
.dhero.ph .ic { width: 44px; height: 44px; stroke-width: 1.4; }
.strip { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip img { height: 76px; width: 76px; border-radius: 12px; object-fit: cover; flex: none; opacity: .72; box-shadow: 0 0 0 1px var(--line); }
.strip img.on { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }
.dtitle { font-family: var(--font-display); font-weight: 500; font-size: 29px; line-height: 1.14; letter-spacing: -.01em; margin-top: 16px; text-wrap: balance; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--sb); color: var(--sf); font-size: 13px; font-weight: 600; }
.pill.n { background: var(--surface); color: var(--ink-2); font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
.pill .ic { width: 15px; height: 15px; }
.ticket { margin-top: 18px; background: var(--surface); border-radius: 20px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.ticket-h { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px 10px; border-bottom: 1.5px dashed var(--line-2); }
.ticket-h .eyebrow { color: var(--ink-2); }
.ticket-h span:last-child { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tkt { list-style: none; padding: 4px 18px 10px; }
.tkt li { display: flex; align-items: baseline; gap: 8px; padding: 8px 0; border-bottom: .5px solid var(--line); min-width: 0; }
.tkt li:last-child { border-bottom: 0; }
.tkt .nm { min-width: 0; overflow-wrap: anywhere; }
.tkt .lead { flex: 1; min-width: 12px; border-bottom: 1px dotted var(--line-2); transform: translateY(-3px); }
.tkt .q { font-family: var(--font-mono); font-size: 14px; text-align: right; flex: none; max-width: 50%; font-variant-numeric: tabular-nums; }

.tbl { padding: 2px 18px 10px; }
.tr { display: grid; grid-template-columns: minmax(0, 2fr) repeat(var(--n), minmax(48px, .6fr)); gap: 4px; align-items: baseline; padding: 8px 0; border-bottom: .5px solid var(--line); }
.tr:last-child { border-bottom: 0; }
.tr.th { position: relative; align-items: end; padding-bottom: 8px; border-bottom: 1.5px dashed var(--line-2); }
.tr.th span { font-size: 12px; line-height: 1.15; color: var(--ink-2); text-align: right; font-weight: 600; }
.tr.th span small { display: block; font-family: var(--font-mono); font-weight: 400; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.tr .nm { overflow-wrap: break-word; hyphens: auto; min-width: 0; padding-right: 4px; }
.tr .v { font-family: var(--font-mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tr .v.all { grid-column: 2 / -1; color: var(--ink-2); }
.tr.sec { grid-template-columns: 1fr; padding-top: 14px; border-bottom: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--sf); }
.notes { display: grid; gap: 8px; margin-top: 14px; }
.note { padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-size: 14.5px; display: flex; gap: 10px; }
.note .ic { width: 19px; height: 19px; color: var(--accent); margin-top: 1px; }
.note.warn .ic { color: var(--cherry); }
details.old { padding: 12px 14px; border-radius: 16px; background: var(--surface-2); font-size: 14.5px; color: var(--ink-2); }
details.old summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }

details.old[open] summary .ic { transform: rotate(180deg); }

.src { margin-top: 14px; color: var(--muted); font-size: 12.5px; }

/* ---------- buttons ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 12px 18px; border-radius: 16px; font-weight: 600; font-size: 16.5px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }

.btn.plain { background: transparent; box-shadow: none; color: var(--accent); }

.btn:disabled { opacity: .4; }
.btn .ic { width: 20px; height: 20px; }
.btns { display: grid; gap: 10px; margin-top: 18px; }
.btns.two { grid-template-columns: 1fr 1fr; }

/* ---------- scope bar + segmented ---------- */
.scope { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; margin-top: 10px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); text-align: left; }
.scope .thumb { width: 36px; height: 36px; border-radius: 10px; }
.scope .thumb .ic { width: 20px; height: 20px; }
.scope .ctx b { -webkit-line-clamp: 1; font-size: 15px; }
.scope .ic.chev { width: 18px; height: 18px; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; margin-top: 12px; background: var(--line); border-radius: 12px; }
.seg button { min-height: 34px; padding: 4px 6px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.cap { color: var(--muted); font-size: 13.5px; margin-top: 8px; padding: 0 4px; }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 80; background: rgba(12, 9, 6, .45); }
.scrim.new { animation: fade .2s; }
.sheet.new { animation: slideup .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; max-height: 86vh; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(18px + var(--bottom-inset)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); }
.sheet-in { max-width: 560px; margin: 0 auto; }
@keyframes slideup { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 2px auto 10px; }
.sheet h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; text-align: center; margin-bottom: 10px; }
.opt-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 14px 8px 12px; text-align: left; position: relative; }
.opt-row + .opt-row::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; border-top: .5px solid var(--line-2); }
.opt-row .thumb { width: 34px; height: 34px; border-radius: 10px; }
.opt-row .thumb .ic { width: 19px; height: 19px; }
.opt-row .ctx b { font-weight: 500; -webkit-line-clamp: 1; }
.opt-row .tickon { width: 22px; height: 22px; color: var(--accent); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; padding: 12px 16px; min-height: 54px; text-align: left; }
.switch i { flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--line-2); position: relative; transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch[aria-pressed="true"] i { background: var(--accent); }
.switch[aria-pressed="true"] i::after { transform: translateX(20px); }

/* ---------- flashcards ---------- */
.fc-wrap { position: relative; margin-top: 14px; touch-action: pan-y; }
.fc { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow), 0 0 0 1px var(--line); overflow: hidden; cursor: pointer; user-select: none; -webkit-user-select: none; position: relative; will-change: transform; }
.fc.anim { transition: transform .22s ease-out, opacity .22s; }
.fc.in { animation: cardin .22s ease-out; }
@keyframes cardin { from { opacity: .3; transform: scale(.97); } to { opacity: 1; transform: none; } }
.fc img.photo { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.fc-head { padding: 16px 18px 12px; }
.fc-head.flat { padding-bottom: 20px; }
.fc-head .eyebrow { display: flex; align-items: center; gap: 6px; }
.fc-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 26px; line-height: 1.15; margin-top: 6px; text-wrap: balance; }
.fc-head .mt { color: var(--muted); font-size: 13.5px; margin-top: 6px; font-family: var(--font-mono); }
.fc-body { padding: 0 0 6px; border-top: 1.5px dashed var(--line-2); }
.fc-body .tkt { padding-top: 8px; }
.fc-body .notes { padding: 0 16px 14px; margin-top: 6px; }
.fc-tap { padding: 12px 18px 16px; color: var(--muted); font-size: 14px; text-align: center; border-top: .5px solid var(--line); }
.fc-q { padding: 16px 18px 6px; }
.fc .stamp { position: absolute; top: 16px; padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; opacity: 0; border: 2px solid; pointer-events: none; background: var(--surface); }
.fc .stamp.l { right: 16px; color: var(--cherry); transform: rotate(8deg); }
.fc .stamp.r { left: 16px; color: var(--accent); transform: rotate(-8deg); }
.dock { position: sticky; bottom: calc(var(--tab-h) + var(--bottom-inset) + 10px); z-index: 15; margin-top: 14px; padding: 8px 0; }
.dock::before { content: ""; position: absolute; inset: -14px 0 -12px; z-index: -1; background: linear-gradient(to bottom, transparent, var(--bg) 40%); box-shadow: 0 0 0 100vmax transparent; }
.dock .btns { margin-top: 0; }
.meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 14px; }
.meta-row button { color: var(--accent); min-height: 40px; padding: 0 4px; }
.done { text-align: center; padding: 34px 20px; background: var(--surface); border-radius: 24px; box-shadow: 0 0 0 1px var(--line); margin-top: 14px; }
.done h2 { font-family: var(--font-display); font-weight: 500; font-size: 26px; }
.done p { color: var(--muted); margin-top: 6px; }

/* ---------- quiz ---------- */
.qrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px 12px 12px; text-align: left; min-height: 72px; position: relative; }
.qrow + .qrow::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: .5px solid var(--line-2); }
.qrow:disabled { opacity: .45; }
.qrow:active:not(:disabled) { background: var(--surface-2); }
.qrow .thumb { width: 40px; height: 40px; background: var(--accent-soft); color: var(--accent); }
.qrow .ctx b { font-weight: 600; -webkit-line-clamp: 1; }
.qrow .ctx small { white-space: normal; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 0 10px; font-size: 14px; color: var(--muted); }
.qhead .eyebrow { color: var(--ink-2); }
.qcard { background: var(--surface); border-radius: 22px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; margin-top: 12px; }
.qcard img.photo { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.qbody { padding: 16px 18px; }
.qprompt { font-family: var(--font-display); font-weight: 500; font-size: 22px; line-height: 1.22; text-wrap: balance; }
.qbody .tkt { padding: 6px 0 0; }
.opts { display: grid; gap: 8px; margin-top: 12px; }
.opt { display: flex; gap: 12px; align-items: baseline; text-align: left; min-height: 54px; padding: 13px 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 16px; }
.opt .k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: none; }
.opt:active:not(:disabled) { background: var(--surface-2); }
.opt.right { background: var(--ok-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.opt.wrong { background: var(--cherry-soft); box-shadow: inset 0 0 0 2px var(--cherry); }
.opt:disabled { cursor: default; }
.build { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.bchip { min-height: 44px; padding: 8px 14px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 15px; }
.bchip[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); font-weight: 600; }
.bchip.right { background: var(--ok-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.bchip.wrong { background: var(--cherry-soft); box-shadow: inset 0 0 0 2px var(--cherry); text-decoration: line-through; }
.bchip.missed { box-shadow: inset 0 0 0 2px var(--accent); background: transparent; border: 0; outline: 2px dashed var(--accent); outline-offset: -4px; }
.fb { margin-top: 12px; padding: 12px 16px; border-radius: 14px; font-weight: 600; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--cherry-soft); }
.after { margin-top: 12px; }
.after .ticket { margin-top: 0; }
.ring { position: relative; width: 132px; height: 132px; margin: 6px auto 10px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease-out; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 34px; font-weight: 500; }
ul.miss { list-style: none; margin-top: 8px; text-align: left; }
ul.miss li { padding: 8px 0; border-top: .5px solid var(--line); }

/* ---------- more ---------- */
.brand-card { margin-top: 6px; background: var(--brand); color: var(--brand-ink); border-radius: 24px; overflow: hidden; }
.brand-card .bc-top { padding: 26px 22px 22px; display: flex; flex-direction: column; align-items: flex-start; }
.brand-card .wm small { font-size: 12.5px; }
.brand-card .wm b { font-size: 46px; }
.brand-card img { display: block; width: 100%; height: 130px; object-fit: cover; }
.stat { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.stat + .stat { border-top: .5px solid var(--line-2); }
.stat .thumb { width: 36px; height: 36px; border-radius: 10px; }
.stat .thumb .ic { width: 20px; height: 20px; }
.stat .ctx { flex: 1; }
.stat .ctx b { -webkit-line-clamp: 1; font-weight: 500; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.stat .prog { margin-top: 7px; }
.stat .prog i { background: var(--sf); }
.gl { padding: 4px 16px; }
.gl details { border-top: .5px solid var(--line-2); padding: 12px 0; }
.gl details:first-child { border-top: 0; }
.gl summary { font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.gl summary::-webkit-details-marker { display: none; }
.gl summary .ic { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
.gl details[open] summary .ic { transform: rotate(180deg); }
.gl details p { color: var(--ink-2); margin-top: 6px; font-size: 15px; }
.small { color: var(--muted); font-size: 13px; padding: 14px 6px 0; }

@media (max-width: 380px) {
  .lt { font-size: 30px; }
  .wm b { font-size: 46px; }
  .rcard { width: 138px; }
}
@media (prefers-reduced-motion: reduce) {
  .view.enter, .view.push, .sheet.new, .scrim.new, .fc.in { animation: none; }
  .fc.anim, .prog i, .ring .fg { transition: none; }
}
.sclear[hidden] { display: none; }

.tr .nm { font-size: 15px; }
.sheet .btns { position: sticky; bottom: -8px; background: var(--bg); padding: 10px 0 4px; margin-top: 10px; }

/* ================= modern overrides ================= */
body { font-variant-numeric: tabular-nums; letter-spacing: -.005em; }
.lt { font-weight: 700; font-size: 34px; letter-spacing: -.025em; line-height: 1.08; padding: 8px 0 2px; }
.lt-sub { font-size: 15px; color: var(--muted); margin-top: 4px; }
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .05em; color: var(--muted); }
.gh { padding: 26px 6px 8px; }
.gh .eyebrow { color: var(--muted); }
.gh button { font-weight: 600; }
.cnt { font-family: var(--font-ui); font-size: 14px; color: var(--muted); }
.wm b, .brand-card .wm b { font-family: var(--font-brand); }

/* floating glass tab bar */
.tabbar { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; pointer-events: none;
  padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(10px + var(--bottom-inset)) max(14px, env(safe-area-inset-left, 0px)); }
.tabbar-in { pointer-events: auto; max-width: 420px; height: 64px; padding: 5px; gap: 2px; border-radius: 34px; background: var(--tabbg);
  -webkit-backdrop-filter: saturate(200%) blur(24px); backdrop-filter: saturate(200%) blur(24px);
  box-shadow: 0 10px 34px rgba(10, 10, 30, .18), 0 0 0 .5px var(--line-2), inset 0 .5px 0 rgba(255, 255, 255, .5); }
.tab { border-radius: 29px; font-size: 10.5px; font-weight: 600; gap: 1px; }
.tab svg { width: 25px; height: 25px; }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.tab .badge { top: 6px; }
.view { padding-bottom: calc(var(--tab-h) + var(--bottom-inset) + 24px); }
.dock { bottom: calc(var(--tab-h) + var(--bottom-inset) + 6px); }
.nav.scrolled { box-shadow: 0 .5px 0 var(--line); }
.nbtn { font-weight: 500; }

/* search + chips + segmented */
.sfield input { height: 42px; border-radius: 13px; background: var(--fill); box-shadow: none; font-size: 17px; }
.sfield input:focus { box-shadow: inset 0 0 0 2px var(--accent); background: var(--surface); }

.chip { background: var(--fill); box-shadow: none; font-weight: 500; min-height: 36px; padding: 6px 15px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip small { font-family: var(--font-ui); font-weight: 500; }
.seg { background: var(--fill); border-radius: 11px; }
.seg button { border-radius: 9px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 2px 6px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }

/* hero + tiles */
.hero { border-radius: 30px; min-height: 196px; padding: 20px 22px 20px; box-shadow: var(--shadow); }
.hero::before { background: linear-gradient(to top, rgba(14, 10, 8, .78) 0%, rgba(14, 10, 8, .28) 55%, rgba(14, 10, 8, 0) 100%); }

.wm small { font-weight: 500; letter-spacing: .01em; }
.tiles { gap: 12px; margin-top: 14px; }
.tile { border-radius: 26px; min-height: 132px; padding: 14px 16px; box-shadow: var(--shadow); }
.tile::before { background: linear-gradient(to top, rgba(10, 8, 6, .8) 0%, rgba(10, 8, 6, .18) 62%, rgba(10, 8, 6, .05) 100%); }
.tile .ic { width: 34px; height: 34px; padding: 7px; top: 12px; right: 12px; border-radius: 50%; background: rgba(255, 255, 255, .22); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tile b { font-family: var(--font-ui); font-weight: 700; font-size: 21px; letter-spacing: -.02em; }
.tile span { font-size: 12.5px; font-weight: 500; opacity: .92; }

/* lists */
.group { border-radius: 22px; box-shadow: none; }
.cell { min-height: 70px; padding: 9px 14px 9px 12px; }

.thumb { width: 52px; height: 52px; border-radius: 15px; }

.ctx b { font-size: 16.5px; font-weight: 600; letter-spacing: -.012em; }

.trail .ic { width: 16px; height: 16px; opacity: .55; }
.trail .ic.learned, .trail .ic.favmark { opacity: 1; }
.rcard { border-radius: 20px; box-shadow: none; width: 158px; padding: 12px 14px; }
.scope { border-radius: 18px; box-shadow: none; padding: 11px 14px; }
.empty, .done { border-radius: 24px; box-shadow: none; }
.hint { font-size: 14px; }

/* dish detail */
.dhero { border-radius: 28px; box-shadow: var(--shadow); }
.dhero img { aspect-ratio: 1 / 1; }
.dhero.ph { height: 132px; }
.strip img { border-radius: 14px; box-shadow: none; }
.dtitle { font-weight: 700; font-size: 28px; letter-spacing: -.022em; line-height: 1.12; margin-top: 18px; }
.pill { height: 30px; padding: 0 12px; font-weight: 600; }
.pill.n { background: var(--fill); box-shadow: none; color: var(--ink-2); font-weight: 500; }
.ticket { border-radius: 22px; box-shadow: none; }
.ticket-h { border-bottom: .5px solid var(--line); padding: 15px 18px 11px; }
.ticket-h span:last-child { font-family: var(--font-ui); font-size: 13px; }
.tkt .lead { display: none; }
.tkt li { justify-content: space-between; padding: 11px 0; gap: 16px; border-bottom: .5px solid var(--line); }
.tkt .q { font-family: var(--font-ui); font-weight: 600; font-size: 15.5px; }
.tkt li.sec { justify-content: flex-start; }
.tr { padding: 11px 0; border-bottom: .5px solid var(--line); }
.tr.th { border-bottom: .5px solid var(--line-2); }
.tr.th span small, .tr .v { font-family: var(--font-ui); }

/* ======================= GLASS LAYER =======================
   A tinted gradient ground (fixed) with frosted panels on top: every surface is translucent,
   blurred, edged with a 1px light line and a top highlight. Photos carry glass label plates. */
:root {
  --glass: rgba(255, 255, 255, .56); --glass-strong: rgba(255, 255, 255, .78); --glass-line: rgba(255, 255, 255, .7); --glass-edge: rgba(255, 255, 255, .9);
  --glass-shadow: 0 1px 1px rgba(30, 40, 70, .04), 0 10px 30px rgba(30, 40, 80, .10);
  --blur: blur(22px) saturate(180%);
  --accent-grad: linear-gradient(135deg, #2BB27E 0%, #12805A 100%);
  --accent-glow: 0 8px 22px rgba(24, 150, 105, .35);
  --muted: #6F6F7A; --ink-2: #3F3F49;
  --g1: rgba(214, 170, 140, .62); --g2: rgba(70, 190, 150, .38); --g3: rgba(110, 150, 255, .34); --g4: rgba(255, 120, 150, .30); --g5: rgba(255, 190, 90, .26);
  --bg: #EEF0F6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glass: rgba(46, 46, 54, .52); --glass-strong: rgba(36, 36, 44, .78); --glass-line: rgba(255, 255, 255, .13); --glass-edge: rgba(255, 255, 255, .22);
    --glass-shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 34px rgba(0, 0, 0, .45);
    --accent-grad: linear-gradient(135deg, #46DFA0 0%, #1FAF7A 100%); --accent-glow: 0 8px 24px rgba(60, 203, 143, .28);
    --muted: #A2A2AD; --ink-2: #D7D7DE;
    --g1: rgba(205, 150, 110, .34); --g2: rgba(40, 190, 140, .26); --g3: rgba(70, 110, 255, .30); --g4: rgba(255, 80, 120, .22); --g5: rgba(255, 170, 60, .16);
    --bg: #07080C;
  }
}
:root[data-theme="dark"] {
  --glass: rgba(46, 46, 54, .52); --glass-strong: rgba(36, 36, 44, .78); --glass-line: rgba(255, 255, 255, .13); --glass-edge: rgba(255, 255, 255, .22);
  --glass-shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 34px rgba(0, 0, 0, .45);
  --accent-grad: linear-gradient(135deg, #46DFA0 0%, #1FAF7A 100%); --accent-glow: 0 8px 24px rgba(60, 203, 143, .28);
  --muted: #A2A2AD; --ink-2: #D7D7DE;
  --g1: rgba(205, 150, 110, .34); --g2: rgba(40, 190, 140, .26); --g3: rgba(70, 110, 255, .30); --g4: rgba(255, 80, 120, .22); --g5: rgba(255, 170, 60, .16);
  --bg: #07080C;
}

/* ground */
.bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 34% at 6% 4%, var(--g1), transparent 72%),
    radial-gradient(52% 32% at 100% 14%, var(--g2), transparent 72%),
    radial-gradient(64% 36% at 0% 52%, var(--g3), transparent 74%),
    radial-gradient(56% 34% at 100% 70%, var(--g4), transparent 72%),
    radial-gradient(64% 34% at 12% 100%, var(--g5), transparent 74%),
    var(--bg); }
.view { position: relative; z-index: 1; }
.nav, .tabbar { z-index: 50; }
body::before { background: transparent; }

/* panels */
.group, .ticket, .note, .scope, .qcard, .rcard, .empty, .done, .allergens, details.old, .brand-card .bc-top {
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line); }

.thumb { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), 0 2px 8px rgba(30, 40, 80, .08); }
.thumb img { border-radius: inherit; }

/* nav + tab bar */
.nav.scrolled { background: var(--navbg); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 .5px 0 var(--glass-line); }
.nbtn.back, .nbtn.star, .nav-l .nbtn { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line), 0 4px 14px rgba(30, 40, 80, .10); height: 38px; border-radius: 19px; padding: 0 12px 0 8px; margin: 3px 0; }
.nbtn.star { min-width: 38px; padding: 0; width: 38px; margin-right: 4px; }
.tabbar-in { background: var(--glass-strong); -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%);
  box-shadow: 0 14px 40px rgba(20, 30, 70, .22), inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line); }
.tab[aria-current="page"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(40, 170, 120, .25), inset 0 1px 0 rgba(255, 255, 255, .35); }

/* controls */
.sfield input { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line); height: 44px; border-radius: 14px; }

.sbar::before { content: ""; position: absolute; inset: 0 -100vmax; z-index: -1; background: var(--navbg); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 .5px 0 var(--glass-line); opacity: 0; transition: opacity .2s; }
.sbar.stuck::before { opacity: 1; }
.chip { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: 0 6px 16px rgba(20, 20, 40, .22); }
.chip.tag[aria-pressed="true"] { background: var(--accent-grad); color: #fff; box-shadow: var(--accent-glow); }
.seg { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 0 0 1px var(--glass-line), inset 0 1px 0 var(--glass-edge); }
.seg button[aria-pressed="true"] { background: var(--glass-strong); box-shadow: 0 3px 10px rgba(20, 30, 70, .16), inset 0 1px 0 var(--glass-edge); }
.btn { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--accent); box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line), 0 6px 18px rgba(30, 40, 80, .08); }
.btn.primary { background: var(--accent-grad); color: #fff; box-shadow: var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .45); }

.btn.warn { background: var(--cherry-soft); color: var(--cherry); box-shadow: inset 0 0 0 1px rgba(229, 72, 77, .28); }
.btn.plain { background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.prog { background: rgba(120, 130, 160, .22); }
.prog i { background: var(--accent-grad); }

.switch i { background: rgba(120, 130, 160, .35); }

/* sheet + brand */

/* entrance */
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {

}

/* glass polish: stronger tab bar, quiz header always frosted */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tabglass: rgba(30, 30, 38, .90); } }
:root[data-theme="dark"] { --tabglass: rgba(30, 30, 38, .90); }
.tabbar-in { background: var(--tabglass); }
.nav.close-nav, .nav:has(.nbtn.close), .nav:has([data-act="qclose"]) { background: var(--navbg); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 .5px 0 var(--glass-line); }
:root { --tabglass: rgba(255, 255, 255, .95); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tabglass: rgba(28, 28, 36, .95); } }
:root[data-theme="dark"] { --tabglass: rgba(28, 28, 36, .95); }
.dock::before { -webkit-backdrop-filter: none; backdrop-filter: none; -webkit-mask-image: none; mask-image: none; inset: -34px -100vmax -12px; background: linear-gradient(to bottom, transparent, var(--bg) 62%); opacity: .94; }
.sbar { clip-path: none; }
.sbar::before { inset: 0 -16px; }

/* ===== round 2: calmer glass, search icon, clearer segmented control, soft headers ===== */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fade-a: rgba(10, 11, 16, .94); --fade-b: rgba(10, 11, 16, .6); } }
:root[data-theme="dark"] { --fade-a: rgba(10, 11, 16, .94); --fade-b: rgba(10, 11, 16, .6); }

/* search icon was painted over by the blurred input */
.sfield .ic { z-index: 2; }
.sfield input { padding-left: 42px; }
.sfield .ic { left: 14px; }

/* tiles + hero: no plates, text sits straight on the photo over a soft gradient */
.plate { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; border-radius: 0; padding: 0; text-shadow: 0 1px 10px rgba(0, 0, 0, .55); }

.tile .plate > span { font-size: 12.5px; opacity: .92; }
.hero { padding: 18px; }
.hero::before { background: linear-gradient(to bottom, rgba(14, 10, 8, .30) 0%, rgba(14, 10, 8, 0) 38%, rgba(14, 10, 8, .72) 100%); }
.hero p.plate { padding: 0; font-size: 16px; font-weight: 600; max-width: 30ch; }

/* headers: soft fade instead of a hard black band */
.nav.scrolled, .nav.always, .nav:has([data-act="qclose"]) { background: linear-gradient(to bottom, var(--fade-a), var(--fade-b)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: none; }
.sbar::before { inset: 0 calc(50% - 50vw); background: linear-gradient(to bottom, var(--fade-a), var(--fade-b)); box-shadow: none; }

/* segmented control: pill, obvious selected state */
.seg { border-radius: 999px; padding: 4px; gap: 2px; background: rgba(120, 130, 160, .16); }
.seg button { min-height: 38px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-grad); color: #fff; box-shadow: var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .4); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #03160E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #03160E; } }

/* round 2b: fades without hard edges (gradient layers, no blur boxes) */

.nav::before { content: ""; position: absolute; inset: 0 0 -18px; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .2s;
  background: linear-gradient(to bottom, var(--fade-a) 0%, var(--fade-a) 62%, transparent 100%); }

.sbar::before { inset: 0 calc(50% - 50vw) -16px; -webkit-backdrop-filter: none; backdrop-filter: none; background: linear-gradient(to bottom, var(--fade-a) 0%, var(--fade-a) 66%, transparent 100%); }

/* round 3: solid headers (only a thin soft edge), spacing after filter note */
:root { --fade-a: rgba(238, 240, 246, .98); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fade-a: rgba(8, 9, 13, .98); } }
:root[data-theme="dark"] { --fade-a: rgba(8, 9, 13, .98); }
.nav::before { background: linear-gradient(to bottom, var(--fade-a) calc(100% - 18px), transparent 100%); }

/* ===== desktop / wide windows: a calm centred phone-width column on a quiet ground ===== */

}

/* tab bar: slide a finger across it */

.tab { transition: background .15s, color .15s, transform .15s; }

/* ===================== SHIFTS (Смены) ===================== */
:root { --am: #0F7A55; --pm: #4651D2; --am-bg: linear-gradient(135deg, #22A877, #0F7A55); --pm-bg: linear-gradient(135deg, #6573F2, #4651D2); --am-soft: rgba(31, 157, 110, .16); --pm-soft: rgba(90, 105, 240, .16); --grid: rgba(120, 130, 160, .22); }

:root[data-theme="dark"] { --am: #46DFA0; --pm: #A3AEFF; --am-bg: linear-gradient(135deg, #1FA372, #0E7552); --pm-bg: linear-gradient(135deg, #5A68E8, #3E49C2); --am-soft: rgba(70, 223, 160, .16); --pm-soft: rgba(130, 145, 255, .2); --grid: rgba(255, 255, 255, .09); }

/* five tabs */
.tabbar-in { grid-template-columns: repeat(5, 1fr); max-width: 460px; }

.dstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.dpill { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 62px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line); color: var(--ink); transition: transform .15s; }

.dpill[aria-pressed="true"] { background: var(--accent-grad); box-shadow: var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .4); transform: translateY(-1px); }
.dpill[aria-pressed="true"] small, .dpill[aria-pressed="true"] b { color: #fff; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dpill[aria-pressed="true"] small, :root:not([data-theme="light"]) .dpill[aria-pressed="true"] b { color: #03160E; } }

.me-note, .on-note { margin-bottom: 12px; align-items: flex-start; }

/* timeline */
.tl { padding: 12px 14px 14px; border-radius: 22px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line); }

.sh-am { background: var(--am-bg); }

/* week matrix */

.wk-scroll::-webkit-scrollbar { display: none; }

/* hours */

.hrs + .hrs { border-top: .5px solid var(--grid); }
.hrs .ctx { display: block; }
.hrs .ctx > b { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 15.5px; gap: 8px; }

.hrs.me .ctx > b > span:first-child { color: var(--accent); }
.wk { font-size: 11.5px; table-layout: fixed; width: 100%; }
.wk th, .wk td { padding: 7px 1px; white-space: normal; line-height: 1.2; }
.wk thead th { padding-top: 10px; }

.wk td { min-width: 0; }
.wk tr.wk-gap .wk-n { white-space: normal; line-height: 1.15; font-size: 12px; }
.wk .wk-n { width: 92px; min-width: 92px; font-size: 12.5px; }
.tl-now { width: 1.5px; opacity: .85; }

/* round: spacing + week matrix on one line + closing extension */
.me-row { margin-bottom: 14px; }
.me-row + .dstrip { margin-top: 0; }
.group + .note, .tl + .note, .note + .note, .note + .tl, .tl + .group, .group + .group { margin-top: 12px; }
.hint { margin-top: 10px; }
.wk { font-size: 11px; }
.wk td, .wk th { white-space: nowrap; }
.wk td span { letter-spacing: -.01em; }
.wk td span.long { font-size: 9.5px; letter-spacing: -.03em; }
.wk td.sh-am, .wk td.sh-pm, .wk td.sh-gap { font-weight: 600; }
.wk .wk-n { width: 80px; min-width: 80px; font-size: 12px; padding-left: 12px; }
.wk td.sh-gap { white-space: normal; }
.tl-track { background-size: calc(100% / var(--n, 13)) 100%; }
.tl-ext { position: absolute; top: 2px; bottom: 2px; border-radius: 0 10px 10px 0; opacity: .38; background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .5) 0 4px, transparent 4px 8px); box-shadow: none; margin-left: -6px; padding-left: 6px; z-index: 0; }
.tl-bar { z-index: 1; }
.closegrp { margin: 12px 0 0; }
.closegrp .switch { align-items: center; }
.closegrp .sw-t { display: block; min-width: 0; }
.closegrp .sw-t b { display: block; font-weight: 600; font-size: 15px; }
.closegrp .sw-t small { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.closegrp + .gh { margin-top: 20px; }
.tl-ext { margin-left: 0; padding-left: 0; opacity: .5; background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .45) 0 4px, transparent 4px 8px), var(--am-bg); border-radius: 10px; }
.tl-ext.sh-pm { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .45) 0 4px, transparent 4px 8px), var(--pm-bg); }
.wk .wk-n { width: 86px; min-width: 86px; padding-left: 10px; font-size: 11.5px; }
/* headers: blurred + masked so scrolled text never reads through */
.nav::before { background: var(--fade-a); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent 100%); mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent 100%); }
.sbar::before { background: var(--fade-a); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 8px), transparent 100%); mask-image: linear-gradient(to bottom, #000 calc(100% - 8px), transparent 100%); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--bottom-inset) + 24px); transform: translateX(-50%); z-index: 120; max-width: min(86vw, 360px); padding: 12px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 600; text-align: center; color: var(--bg); background: var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, .3); animation: toastin .25s cubic-bezier(.2, .8, .2, 1); transition: opacity .35s, transform .35s; pointer-events: none; }
.toast.out { opacity: 0; transform: translateX(-50%) translateY(8px); }

/* ---- shifts: week nav, pay report ---- */

.sfb { position: fixed; left: 0; right: 0; bottom: max(var(--kb, 0px), var(--bottom-inset)); z-index: 60; padding: 18px 0 12px; background: linear-gradient(to top, var(--fade-a) 55%, transparent); }

.sa-a i { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--fill) center / cover no-repeat; color: var(--muted); box-shadow: inset 0 0 0 1px var(--glass-line); }

/* ---- UI kit pass: one shape language for similar elements ----

/* ---- glass lens under the active tab ---- */
.tabbar-in { position: relative; }
.tab { position: relative; z-index: 1; }
.tab[aria-current="page"], .tab.hot { background: none; box-shadow: none; }
.tab.hot { transform: scale(1.1); color: var(--accent); }
.lens { position: absolute; left: 0; top: 5px; bottom: 5px; width: 0; z-index: 0; pointer-events: none; border-radius: 29px;
  background: linear-gradient(180deg, color-mix(in srgb, #fff 34%, transparent), color-mix(in srgb, #fff 6%, transparent) 70%), var(--accent-soft);
  box-shadow: inset 0 0 0 1px rgba(40, 170, 120, .28), inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -6px 12px rgba(255, 255, 255, .08), 0 3px 12px rgba(20, 120, 90, .16);
  -webkit-backdrop-filter: blur(3px) saturate(1.5); backdrop-filter: blur(3px) saturate(1.5);
  transform: translateX(0); transform-origin: 50% 50%;
  transition: transform .52s cubic-bezier(.22, 1.3, .36, 1), scale .34s cubic-bezier(.3, 1.6, .5, 1), box-shadow .25s ease, background .25s ease; }
.tabbar-in.press .lens { scale: 1.12 1.14; box-shadow: inset 0 0 0 1px rgba(40, 170, 120, .35), inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 -8px 16px rgba(255, 255, 255, .16), 0 10px 26px rgba(20, 120, 90, .28); }
.tabbar-in.drag .lens { transition: scale .34s cubic-bezier(.3, 1.6, .5, 1), box-shadow .25s ease; scale: 1.18 1.16; }
.tabbar-in.press { z-index: 2; }
.tab { transition: color .2s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1); }
@media (prefers-reduced-motion: reduce) { .lens, .tab { transition: none !important; } }
.tabbar-in.press .tab[aria-current="page"]:not(.hot) { color: var(--muted); }
.tabbar-in.press .lens { scale: 1.1 1.14; }
/* calmer motion: soft ease with a tiny overshoot, no icon bounce */
.lens { transition: transform .36s cubic-bezier(.3, 1.08, .4, 1), scale .22s ease-out, box-shadow .2s ease, background .2s ease; }
.tabbar-in.press .lens { scale: 1.05 1.08; }
.tabbar-in.drag .lens { transition: scale .22s ease-out, box-shadow .2s ease; scale: 1.08 1.1; }
.tab.hot { transform: none; }
.tab { transition: color .18s ease; }

е общее, в чате не дано."}, {"t": "Сузьма и корт", "d": "Сузьма: густой отцеженный кисломолочный продукт. Корт: сухие шарики из творога. Определения общие, в чате не даны."}, {"t": "Конфи", "d": "Густая фруктовая начинка вроде джема. Определение общее."}, {"t": "Велюр", "d": "Бархатное покрытие десерта (в оформлении корпусных десертов). Определение общее."}, {"t": "Франжипан", "d": "Миндальный крем для тартов. В грушевом тарте: миндальная мука, амаретто, яйцо, сахар, сливочное масло."}, {"t": "Тар татен", "d": "Так в чате написано в завтраке серебряного века. Что именно подаётся, не объяснено."}], "rules": [{"t": "Скретч-карты Kaya", "d": "Лежат возле кассы. Выдаём при заказе блюда и напитка только из меню Kaya. Если гость взял одну позицию, проговариваем, что можно дополнить заказ и получить карту. В карте может быть скидка или бесплатное занятие в студии йоги Kaya. Если карты заканчиваются, сказать менеджеру."}, {"t": "Допродажа к меню Kaya", "d": "В чате от 03.04.2026: предлагайте допом взять креветки или форель. К какому блюду это относится, не уточнено."}, {"t": "Новая матча", "d": "Новая матча используется только для меню матчи 2026 года (клубника, малина, банан, тоник, латте на кокосовом). На все остальные позиции старая. Новую матчу стаффу пить нельзя."}, {"t": "Сироп манго", "d": "Когда закончится сироп манго, используем сироп манго спайси. Граммовки соблюдать строго, не перебарщивать с сиропом."}, {"t": "Нет флипа", "d": "Нет флипа манго-маракуйя на БК: берём флип юдзу, чай при этом другой (см. «Чай апельсин-манго-маракуйя»). Нет флипа клюква-можжевельник: берём флипы вишня и гранат (см. «Чай клюква-можжевельник»)."}], "secs": [{"id": "Кухня", "cats": ["Завтраки", "Вафли и панкейки", "Каши и сырники", "Боулы", "Салаты", "Сэндвичи, тосты, роти", "Супы и паста"]}, {"id": "Напитки", "cats": ["Кофе: классика", "Кофе: авторский", "Матча", "Чай", "Цикорий", "Лимонады и бабл-ти", "Смузи"]}, {"id": "Десерты", "cats": ["Торты и десерты", "Тарты, эклеры, моти, макар     if (t && t.id === 'ed-file' && t.files && t.files[0]) { edPhoto(t.files[0]); t.value = ''; }
  });
  /* an unsaved draft survives closing the app */
  (function () {
    if (!adm.tok) return;
    try {
      var dr = JSON.parse(localStorage.getItem('ttk-draft') || 'null');
      if (!dr || !dr.json) return;
      var nd = JSON.parse(dr.json);
      if (!nd.dishes || !nd.dishes.length) return;
      setData(nd); adm.dirty = true; adm.n = 1; adm.pend = dr.pend || {};
      Object.keys(adm.pend).forEach(function (id) { PH[id] = adm.pend[id]; });
    } catch (e) {}
  })();
  fetchMenu(); stpFetch();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { fetchMenu(); stpFetch(); } });
  setInterval(function () { if (!document.hidden) stpFetch(); }, 60000);
  admLoadCloud();

  try { if (/[#&]welcome\b/.test(location.hash)) { localStorage.removeItem('ttk-ask-done'); store.me = ''; save(); history.replaceState(null, '', location.pathname + location.search); } } catch (e) {}
  render({ scroll: 0 });
  document.getElementById('startup').dispatchEvent(new Event('cups-rendered'));
  showWelcome();
  if (inTG) {
    try {
      TG.expand();
      if (TG.BackButton) TG.BackButton.onClick(function () { goBack(); });
      TG.onEvent('themeChanged', function () { applyTheme(); render({ scroll: window.scrollY }); });
    } catch (e) {}
    cloudLoad();
  }
  /* auto-update: version.txt on the server holds the build id; if it differs, reload through a fresh URL so cached copies are skipped */
  (function () {
    var BUILD = 'a6bb96a736';
    if (BUILD.charAt(0) === '_' || !/^https?:$/.test(location.protocol) || !window.fetch) return;
    function check() {
      try {
        fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
          t = (t || '').trim();
          if (!/^[a-z0-9]{6,40}$/.test(t) || t === BUILD) return;
          try { if (sessionStorage.getItem('ttk-upd') === t) return; sessionStorage.setItem('ttk-upd', t); } catch (e) {}
          location.replace(location.pathname + '?v=' + t + location.hash);
        }).catch(function () {});
      } catch (e) {}
    }
    check();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  })();
}
telegramReady.then(function () {
  // Keep startup errors visible to the existing window error handler.
  if (typeof queueMicrotask === 'function') queueMicrotask(startCups);
  else setTimeout(startCups, 0);
});
